name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    name: offline self-tests (no key, no docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node runner/test_score.js
      - run: node runner/test_provider.js
