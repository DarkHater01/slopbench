name: _probe-free
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s https://openrouter.ai/api/v1/models > /tmp/m.json
          python3 - <<'EOF'
          import json
          m = json.load(open('/tmp/m.json'))['data']
          free = [x for x in m if x.get('pricing', {}).get('prompt') == '0' and x.get('pricing', {}).get('completion') == '0']
          free.sort(key=lambda x: x['id'])
          print('TOTAL_FREE', len(free))
          for x in free:
              print(x['id'], x.get('context_length'))
          EOF