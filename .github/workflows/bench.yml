name: weekly-bench

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 420 # full 200-run batch stalls on free-tier backoffs; be generous
    steps:
      - name: Checkout (full history so the results commit pushes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build sandbox image
        run: docker build -t slopbench-sandbox sandbox/

      - name: Run benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node runner/run.js
          node runner/score.js

      - name: Commit results
        run: |
          git config user.name "slopbench-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: weekly benchmark results"
          # concurrent runs push to main; rebase so we never lose the commit to a race
          git pull --rebase origin main
          git push