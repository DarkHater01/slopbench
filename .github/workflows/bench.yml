name: weekly-bench

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 600 # free-tier stalls on 429 backoffs; checkpoints cap any loss at 2 min
    steps:
      - name: Checkout (full history so the results commit pushes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build sandbox image
        run: docker build -t slopbench-sandbox sandbox/

      - name: Run benchmark (checkpointed)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name "slopbench-bot"
          git config user.email "actions@users.noreply.github.com"
          node runner/run.js &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 120
            git add data/
            git diff --cached --quiet || {
              git commit -m "chore: bench checkpoint"
              git pull --rebase origin main
              git push -q
            }
          done
          wait "$pid"
          node runner/score.js
          node runner/regen_readme.js
          git add data/ README.md
          git diff --cached --quiet || git commit -m "chore: weekly benchmark results"
          git pull --rebase origin main
          git push